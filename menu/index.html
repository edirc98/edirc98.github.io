<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Lunes — Viernes</p>
    <h1>Menú semanal</h1>
    <p class="sub">Proteína, hidrato y verdura en cada comida principal. Legumbre y pescado garantizados al menos una vez por semana.</p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="controls-row">
    <nav class="tabs" id="tabs"></nav>
    <div class="view-switch" id="viewSwitch">
      <button class="view-btn" data-view="day">Vista día</button>
      <button class="view-btn" data-view="week">Vista semana</button>
    </div>
  </div>

  <label class="toggle-row">
    <input type="checkbox" id="snackToggle" checked>
    mostrar media mañana
  </label>

  <main id="mainArea"></main>

  <footer>
    Versión estática · próximamente: regenerar platos con IA
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
